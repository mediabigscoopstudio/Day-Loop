{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="robots" content="noindex">
  <title>{% block title %}Day Loop{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'ui/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'ui/css/shell.css' %}">
  <link rel="stylesheet" href="{% static 'ui/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'ui/css/modal.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="{% static 'ui/vendor/htmx.min.js' %}"></script>
  <script src="{% static 'ui/js/ui.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
