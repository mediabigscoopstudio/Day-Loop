{% comment %}Form-field macro: {% include "ui/partials/field.html" with field=form.name %}{% endcomment %}
<div class="field {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for e in field.errors %}<span class="field-error" role="alert">{{ e }}</span>{% endfor %}
</div>
