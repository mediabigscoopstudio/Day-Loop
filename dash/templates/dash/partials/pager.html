{% load dash_tags %}
{% if page.paginator.count %}
<nav class="pager" aria-label="Pagination">
  <span>Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  <span style="display:flex;gap:8px;align-items:center">
    {% if page.has_previous %}<a class="btn sm" href="{% qs page=page.previous_page_number %}">← Prev</a>{% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn sm" href="{% qs page=page.next_page_number %}">Next →</a>{% endif %}
  </span>
</nav>
{% endif %}
