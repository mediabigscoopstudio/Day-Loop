{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{% static 'ui/css/tokens.css' %}"><link rel="stylesheet" href="{% static 'ui/css/components.css' %}">
<style>
  body { background: #fff; padding: 24px; max-width: 820px; margin: 0 auto; }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid var(--green-900); padding-bottom: 12px; margin-bottom: 16px; }
  .sheet-head h1 { font-size: 22px; color: var(--green-900); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px; }
  .box { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .box h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .big { font-size: 20px; font-weight: 800; }
  .noprint { margin-bottom: 16px; }
  @media print { .noprint { display: none !important; } body { padding: 0; } }
</style></head>
<body>
<div class="noprint"><button class="btn primary" onclick="window.print()">Print</button> <a class="btn" href="/orders/">Back to orders</a></div>
{% block content %}{% endblock %}
</body></html>
