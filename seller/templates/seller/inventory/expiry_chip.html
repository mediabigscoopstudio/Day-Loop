{% if v.expires_on %}{% if v.is_expired %}<span class="chip danger">Expired {{ v.expires_on|date:"M j, Y" }}</span>{% elif v.is_expiring_soon %}<span class="chip amber">Expires in {{ v.days_to_expiry }} day{{ v.days_to_expiry|pluralize }}</span>{% else %}<span class="chip neutral">Exp {{ v.expires_on|date:"M Y" }}</span>{% endif %}{% else %}<span class="cat-meta">No expiry</span>{% endif %}
